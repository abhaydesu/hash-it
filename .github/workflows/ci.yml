name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: neondb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      AUTH_SECRET: test-auth-secret-for-ci-minimum-32-chars-long
      AUTH_GOOGLE_ID: mock-google-id
      AUTH_GOOGLE_SECRET: mock-google-secret
      DATABASE_URL: "postgresql://postgres:password@localhost:5432/neondb?schema=test_hash_it"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Migrate test database
        run: npx prisma db push --skip-generate

      - name: ESLint
        run: npx eslint . --max-warnings=0

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run --project=unit

      - name: Component tests
        run: npx vitest run --project=component

      - name: Integration tests
        run: npx vitest run --project=integration

      - name: Next.js build
        run: npx next build
